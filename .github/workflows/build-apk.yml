name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk The-Cosmere-Archives.apk
      - uses: actions/upload-artifact@v4
        with:
          name: The-Cosmere-Archives-Android
          path: The-Cosmere-Archives.apk
      - name: Publish direct-download prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_number }}" The-Cosmere-Archives.apk \
            --title "The Cosmere Archives v0.11.${{ github.run_number }}" \
            --notes "Test APK with update checking. This build uses ephemeral debug signing. Updates may require uninstalling the previous APK until permanent signing is configured. Back up research before replacing the app." \
            --prerelease \
            --target "${{ github.sha }}"
